<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Infra Starter Pack</title>
  <desc id="description">Repository evidence to documentation, security checks, and runtime QA.</desc>
  <defs>
    <radialGradient id="glow" cx="75%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1b3d7a"/>
      <stop offset="55%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18233a"/>
      <stop offset="1" stop-color="#0d1321"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(72 66)">
    <rect width="52" height="52" rx="14" fill="#172646" stroke="#4d78c1"/>
    <text x="26" y="33" text-anchor="middle" fill="#82b1ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">IS</text>
    <text x="70" y="34" fill="#f4f7ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Infra Starter Pack</text>
  </g>
  <text x="72" y="225" fill="#f4f7ff" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Know what your repo needs.</text>
  <text x="72" y="305" fill="#82b1ff" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Prove what your app does.</text>
  <text x="76" y="366" fill="#a6b0c8" font-family="Arial, sans-serif" font-size="25">Evidence-based docs · security checks · runtime QA</text>
  <g transform="translate(72 430)">
    <rect width="1056" height="116" rx="18" fill="url(#panel)" stroke="#2b3a59"/>
    <text x="28" y="40" fill="#5fe0b7" font-family="monospace" font-size="17">$</text>
    <text x="54" y="40" fill="#d8e5ff" font-family="monospace" font-size="17">npx github:hamedrabah/infra-starter-pack scan .</text>
    <text x="28" y="82" fill="#8fa0be" font-family="Arial, sans-serif" font-size="18">Read-only scan. No project code executed. No token required.</text>
  </g>
</svg>
